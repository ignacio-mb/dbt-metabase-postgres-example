version: 2

models:
  - name: stg_customers
    description: "Cleaned customer data with full name computed"
    columns:
      - name: customer_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]

  - name: stg_products
    description: "Cleaned product catalog with margin calculation"
    columns:
      - name: product_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: category_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_categories')
              field: category_id
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_suppliers')
              field: supplier_id
      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_orders
    description: "Cleaned orders with shipping metrics"
    columns:
      - name: order_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'processing', 'returned', 'cancelled']

  - name: stg_order_items
    description: "Cleaned order line items with calculated line_total"
    columns:
      - name: order_item_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

  - name: stg_payments
    description: "Cleaned payment transactions"
    columns:
      - name: payment_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_method
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'debit_card', 'paypal', 'bank_transfer', 'cash_on_delivery']
      - name: payment_status
        tests:
          - not_null
          - accepted_values:
              values: ['success', 'pending', 'failed', 'refunded']

  - name: stg_categories
    description: "Product category hierarchy"
    columns:
      - name: category_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: category_name
        tests: [unique, not_null]

  - name: stg_suppliers
    description: "Product suppliers and vendors"
    columns:
      - name: supplier_id
        description: "Primary key"
        tests: [unique, not_null]

  - name: stg_inventory
    description: "Current inventory levels by product and warehouse"
    columns:
      - name: inventory_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

  - name: stg_reviews
    description: "Customer product reviews and ratings"
    columns:
      - name: review_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: rating
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5

  - name: stg_order_events
    description: "Order lifecycle events"
    columns:
      - name: event_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['placed', 'confirmed', 'processing', 'shipped', 'out_for_delivery', 'delivered', 'cancelled', 'refunded']
