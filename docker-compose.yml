services:
  # ─────────────────────────────────────────────
  # Analytics database (where dbt models + Metabase transforms write)
  # ─────────────────────────────────────────────
  analytics-db:
    image: postgres:16-alpine
    container_name: analytics-db
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
    ports:
      - "5433:5432"
    volumes:
      - analytics_data:/var/lib/postgresql/data
      - ./scripts/init-analytics.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U analytics_user -d analytics" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────
  # Metabase application database (stores Metabase's own state)
  # ─────────────────────────────────────────────
  metabase-db:
    image: postgres:16-alpine
    container_name: metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: metabase_pass
    ports:
      - "5434:5432"
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U metabase_user -d metabase" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────
  # Metabase
  # ─────────────────────────────────────────────
  metabase:
    image: metabase/metabase-enterprise:v1.59.x
    container_name: metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: metabase_pass
      MB_DB_HOST: metabase-db
      MB_SETUP_TOKEN: "249fa03d-fd94-4d5b-b94f-b4ebf3df681f"
    ports:
      - "3000:3000"
    depends_on:
      analytics-db:
        condition: service_healthy
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ─────────────────────────────────────────────
  # dbt runner (one-shot: deps → seed → run → test)
  # ─────────────────────────────────────────────
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt-runner
    depends_on:
      analytics-db:
        condition: service_healthy
    volumes:
      - ./dbt_project:/usr/src/dbt
    working_dir: /usr/src/dbt
    environment:
      DBT_PROFILES_DIR: /usr/src/dbt
    command: >
      sh -c "dbt deps && dbt seed && dbt run && dbt test && echo '✅ dbt pipeline complete'"

volumes:
  analytics_data:
  metabase_data:
